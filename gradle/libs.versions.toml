[versions]
junit = "6.1.3"
assertj = "3.27.7"
javapoet = "0.22.0"
compile-testing = "0.24.0"
lombok = "1.18.48"
spring-boot = "4.1.2"
jacoco = "0.8.13"
maven-publish = "0.37.0"
jackson = "2.19.2"
maven-api = "3.6.3"
plexus-utils = "4.1.0"
jimfs = "1.3.2"
jakarta-jms = "3.1.0"
artemis = "2.54.0"
archunit = "1.5.1"
pmd = "7.29.0"
pitest = "1.30.1"
pitest-junit5 = "1.2.3"
pitest-plugin = "1.19.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
javapoet = { module = "com.palantir.javapoet:javapoet", version.ref = "javapoet" }
compile-testing = { module = "com.google.testing.compile:compile-testing", version.ref = "compile-testing" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven-api" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven-api" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
plexus-utils = { module = "org.codehaus.plexus:plexus-utils", version.ref = "plexus-utils" }
jakarta-jms-api = { module = "jakarta.jms:jakarta.jms-api", version.ref = "jakarta-jms" }
artemis-server = { module = "org.apache.activemq:artemis-server", version.ref = "artemis" }
artemis-jakarta-client = { module = "org.apache.activemq:artemis-jakarta-client", version.ref = "artemis" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

[plugins]
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
