# Run the mutation tests each night.
#
# This workflow runs the task mutationTest: PIT (pitest) on bookmap-core, bookmap-processor, and
# bookmap-copybook. The run fails if the mutation score of a module is less than its minimum score
# in build.gradle.kts. The mutation tests take about 20 minutes on a GitHub runner, so they do not
# run on each pull request or push. They run on main at 02:00 UTC each day, and on request
# (Actions > Mutation tests > Run workflow).
#
# A scheduled run does nothing if main has no new commit in the last 25 hours. GitHub sends an
# email for a failed scheduled run to the user who last changed the cron schedule.
#
# The job uploads the PIT reports as the artifact "mutation-reports". The job has read-only access
# and keeps no credential in the checkout.

name: Mutation tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A scheduled run tests only a new main. A run on request always tests.
      - name: Find a new commit
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          skip=false
          last_commit=$(git log -1 --format=%ct HEAD)
          if [ "$EVENT_NAME" = schedule ] && [ $(( $(date +%s) - last_commit )) -gt 90000 ]; then
            skip=true
            echo "::notice::main has no new commit in the last 25 hours. The mutation tests do not run."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        if: steps.changes.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # The open-source cache of setup-java (actions/cache) keeps the Gradle dependencies.
          cache: gradle

      - name: Set up Gradle
        if: steps.changes.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The cache of setup-gradle v6 is a proprietary component. Do not enable it.
          cache-disabled: true

      - name: Run the mutation tests
        if: steps.changes.outputs.skip != 'true'
        run: ./gradlew mutationTest --continue --no-daemon

      - name: Upload the mutation reports
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: "*/build/reports/pitest/"
          if-no-files-found: ignore
