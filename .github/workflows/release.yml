# Build and release BookMap.
#
# On each push to main:
#   1. The build job calculates the next version from the Conventional Commits since the last tag
#      (feat -> minor, fix -> patch, BREAKING CHANGE -> major; other types -> no release),
#      then builds and tests with that version (the build fails if coverage is below 100%).
#      This job has read-only access and keeps no credential in the checkout.
#   2. The release job runs only for refs/heads/main and only when a new version exists.
#      It has write access, runs no project code, and creates the tag vX.Y.Z and a GitHub
#      release with the module JARs that the build job produced.

name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Calculate the next version
        id: version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      - name: Build and test
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            ./gradlew build --no-daemon -PreleaseVersion="$NEW_VERSION"
          else
            ./gradlew build --no-daemon
          fi

      - name: Collect the release JARs
        if: steps.version.outputs.new_tag != ''
        run: |
          mkdir -p release
          for module in bookmap-core bookmap-processor bookmap-transport-simulator bookmap-spring-boot; do
            cp "$module"/build/libs/*.jar release/
          done
          ls -l release

      - name: Upload the release JARs
        if: steps.version.outputs.new_tag != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-jars
          path: release/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release JARs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-jars
          path: release

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: BookMap ${{ needs.build.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.build.outputs.changelog }}
          files: release/*.jar
          fail_on_unmatched_files: true
