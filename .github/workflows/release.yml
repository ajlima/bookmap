# Build and release BookMap.
#
# On each pull request to main: only the build job runs (build, tests, 100% coverage). The build
# job also builds the standalone example of the Gradle plugin (bookmap-examples-gradle-plugin).
# The ruleset on main requires this check before a merge.
#
# On each push to main:
#   1. The build job calculates the next version from the Conventional Commits since the last tag
#      (feat -> minor, fix -> patch, BREAKING CHANGE -> major; other types -> no release),
#      then builds and tests with that version (the build fails if coverage is below 100%).
#      This job has read-only access and keeps no credential in the checkout.
#   2. The publish job signs the modules and publishes them to Maven Central. It runs only for
#      refs/heads/main and only when a new version exists. It has read-only repository access;
#      the Sonatype token and the signing key come from secrets (see RELEASING.md).
#   3. The release job runs after a successful publish. It has write access, runs no project
#      code, and creates the tag vX.Y.Z and a GitHub release with the JARs that the publish
#      job sent to Maven Central (the same bytes).

name: Build and release

on:
  push:
    branches: [main]
  # Pull requests run only the build job. The ruleset on main requires it to pass.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A new push to a pull request cancels its old run. Runs on main never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # The open-source cache of setup-java (actions/cache) keeps the Gradle dependencies.
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The cache of setup-gradle v6 is a proprietary component. Do not enable it.
          cache-disabled: true

      - name: Calculate the next version
        id: version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      - name: Build and test
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            ./gradlew build --no-daemon -PreleaseVersion="$NEW_VERSION"
          else
            ./gradlew build --no-daemon
          fi

      # The example build includes the root build, so it uses the plugin from this commit.
      - name: Build the Gradle plugin example
        run: ./gradlew -p bookmap-examples-gradle-plugin build --no-daemon

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    # The secrets of this job are environment secrets. Add required reviewers to the
    # "maven-central" environment to approve each publication by hand (see RELEASING.md).
    environment: maven-central
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # No cache here: a release always builds from clean dependencies.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The cache of setup-gradle v6 is a proprietary component. Do not enable it.
          cache-disabled: true

      - name: Publish to Maven Central
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is not set. See RELEASING.md."
              exit 1
            fi
          done
          ./gradlew publishAndReleaseToMavenCentral --no-daemon -PreleaseVersion="$NEW_VERSION"

      # The GitHub release gets the same bytes that went to Maven Central.
      - name: Collect the published JARs
        run: |
          mkdir -p published
          for module in bookmap-core bookmap-processor bookmap-transport-simulator bookmap-spring-boot \
                        bookmap-copybook bookmap-copybook-cli bookmap-copybook-gradle-plugin; do
            cp "$module"/build/libs/*.jar published/
          done
          ls -l published

      - name: Upload the published JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-jars
          path: published/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the published JARs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-jars
          path: release

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: BookMap ${{ needs.build.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.build.outputs.changelog }}
          files: release/*.jar
          fail_on_unmatched_files: true
