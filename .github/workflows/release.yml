# Build and release BookMap.
#
# On each pull request to main: only the build job runs (build, tests, 100% coverage).
# The ruleset on main requires this check before a merge.
#
# On each push to main:
#   1. The build job calculates the next version from the Conventional Commits since the last tag
#      (feat -> minor, fix -> patch, BREAKING CHANGE -> major; other types -> no release),
#      then builds and tests with that version (the build fails if coverage is below 100%).
#      This job has read-only access and keeps no credential in the checkout.
#   2. The publish job signs the modules and publishes them to Maven Central. It runs only for
#      refs/heads/main and only when a new version exists. It has read-only repository access;
#      the Sonatype token and the signing key come from secrets (see RELEASING.md).
#   3. The release job runs after a successful publish. It has write access, runs no project
#      code, and creates the tag vX.Y.Z and a GitHub release with the JARs that the publish
#      job sent to Maven Central (the same bytes).

name: Build and release

on:
  push:
    branches: [main]
  # Pull requests run only the build job. The ruleset on main requires it to pass.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A new push to a pull request cancels its old run. Runs on main never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Calculate the next version
        id: version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      - name: Build and test
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            ./gradlew build --no-daemon -PreleaseVersion="$NEW_VERSION"
          else
            ./gradlew build --no-daemon
          fi

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    # The secrets of this job are environment secrets. Add required reviewers to the
    # "maven-central" environment to approve each publication by hand (see RELEASING.md).
    environment: maven-central
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Publish to Maven Central
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is not set. See RELEASING.md."
              exit 1
            fi
          done
          ./gradlew publishAndReleaseToMavenCentral --no-daemon -PreleaseVersion="$NEW_VERSION"

      # The GitHub release gets the same bytes that went to Maven Central.
      - name: Collect the published JARs
        run: |
          mkdir -p published
          for module in bookmap-core bookmap-processor bookmap-transport-simulator bookmap-spring-boot; do
            cp "$module"/build/libs/*.jar published/
          done
          ls -l published

      - name: Upload the published JARs
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: published-jars
          path: published/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the published JARs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: published-jars
          path: release

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: BookMap ${{ needs.build.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.build.outputs.changelog }}
          files: release/*.jar
          fail_on_unmatched_files: true
