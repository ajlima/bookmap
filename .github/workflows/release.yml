# Build and release BookMap.
#
# On each pull request to main: only the build job runs (build, tests, 100% coverage, dependency
# structure, cyclomatic complexity, and module size). A pull request that changes only documentation
# (*.md files and the docs/ folder) skips the Gradle steps, but the build job still checks the commit
# authors and passes. The build job also builds the standalone examples of the Gradle plugin
# (bookmap-examples-gradle-plugin) and of the Maven plugin (bookmap-examples-maven-plugin).
# The ruleset on main requires this check before a merge.
#
# On each push to main:
#   1. The build job calculates the next version from the Conventional Commits since the last tag
#      (feat -> minor, fix -> patch, BREAKING CHANGE -> major; other types -> no release),
#      then builds and tests with that version (the build fails if coverage is below 100%).
#      This job has read-only access and keeps no credential in the checkout.
#   2. The publish job signs the modules and publishes them to Maven Central. It runs only for
#      refs/heads/main and only when a new version exists. It has read-only repository access;
#      the Sonatype token and the signing key come from secrets (see RELEASING.md).
#   3. The attest job runs after a successful publish. It makes a SLSA build provenance
#      attestation for each JAR, POM, and Gradle module file that went to Maven Central. It takes
#      the files from the staging directory of the publish plugin, so the attested bytes are the
#      uploaded bytes. It has only the id-token and attestations permissions, and it runs no build.
#      The release job does not wait for it: if it fails, run the job again.
#   4. The release job runs after a successful publish. It has write access and runs no Gradle
#      build. It creates the tag vX.Y.Z and a GitHub release with the JARs that the publish
#      job staged for Maven Central (the same bytes). Then it sets the new version in the README files
#      (scripts/set-readme-version.sh) and pushes the commit "docs: set the README version to
#      X.Y.Z" to main. A docs commit gives no new release. The push uses a short-lived token of
#      the BookMap release GitHub App, because the ruleset on main blocks the GITHUB_TOKEN and a
#      personal repository cannot add GitHub Actions to the bypass list. The app is a bypass
#      actor of the ruleset. Its key is a secret of the "readme-update" environment (see RELEASING.md).

name: Build and release

on:
  push:
    branches: [main]
  # Pull requests run only the build job. The ruleset on main requires it to pass.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A new push to a pull request cancels its old run. Runs on main never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      new_version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The history shows only the human authors and the release bots. An AI assistant is never
      # an author, a committer, or a co-author. The check runs the script of main, so a pull
      # request cannot weaken it.
      - name: Check the commit authors
        run: |
          git show origin/main:scripts/check-commit-authors.sh > "$RUNNER_TEMP/check-commit-authors.sh" \
            || { echo "error: cannot read the check from main"; exit 1; }
          bash "$RUNNER_TEMP/check-commit-authors.sh" HEAD

      # A pull request that changes only documentation (*.md files and the docs/ folder) skips the
      # Gradle steps, and the build job passes. A push to main always runs the full build, because the
      # release needs it. The workflow always runs, so the required build check always reports.
      - name: Find the changed files
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          docs_only=false
          # The script of main runs, so a pull request cannot change the rule for itself. If main has
          # no script, the full build runs. The checkout is the merge commit of the pull request: its
          # first parent is the base.
          if [ "$EVENT_NAME" = pull_request ] \
            && git show origin/main:scripts/docs-only-change.sh > "$RUNNER_TEMP/docs-only-change.sh"; then
            docs_only=$(bash "$RUNNER_TEMP/docs-only-change.sh" HEAD^1 HEAD)
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice::Only documentation files changed. The Gradle steps do not run."
          fi

      - name: Set up Java 21
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # The open-source cache of setup-java (actions/cache) keeps the Gradle dependencies.
          cache: gradle

      - name: Set up Gradle
        if: steps.changes.outputs.docs_only != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The cache of setup-gradle v6 is a proprietary component. Do not enable it.
          cache-disabled: true

      - name: Calculate the next version
        if: steps.changes.outputs.docs_only != 'true'
        id: version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: false
          dry_run: true

      - name: Build and test
        if: steps.changes.outputs.docs_only != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            ./gradlew build --no-daemon -PreleaseVersion="$NEW_VERSION"
          else
            ./gradlew build --no-daemon
          fi

      # The example build includes the root build, so it uses the plugin from this commit.
      - name: Build the Gradle plugin example
        if: steps.changes.outputs.docs_only != 'true'
        run: ./gradlew -p bookmap-examples-gradle-plugin build --no-daemon

      # The Maven example takes the snapshot of this commit from the local Maven repository.
      - name: Build the Maven plugin example
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          bookmap-examples-maven-plugin/mvnw -B -f bookmap-examples-maven-plugin/pom.xml verify

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    # The secrets of this job are environment secrets. Add required reviewers to the
    # "maven-central" environment to approve each publication by hand (see RELEASING.md).
    environment: maven-central
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          # No cache here: a release always builds from clean dependencies.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The cache of setup-gradle v6 is a proprietary component. Do not enable it.
          cache-disabled: true

      - name: Publish to Maven Central
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is not set. See RELEASING.md."
              exit 1
            fi
          done
          ./gradlew publishAndReleaseToMavenCentral --no-daemon -PreleaseVersion="$NEW_VERSION"

      # The publish plugin (com.vanniktech.maven.publish) stages the files of each module in
      # build/publishing/mavenCentral, then uploads them in one bundle. The attest job attests
      # these files, and the release job attaches the JARs of these files to the GitHub release.
      # Thus the attested bytes, the GitHub release, and Maven Central have the same bytes.
      - name: Upload the published files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-files
          path: |
            */build/publishing/mavenCentral/**/*.jar
            */build/publishing/mavenCentral/**/*.pom
            */build/publishing/mavenCentral/**/*.module
          if-no-files-found: error
          retention-days: 7

  # This job has no environment and no secret, and it runs no build. Only this job can get an
  # OIDC token. The release job does not wait for it, so a failure here does not stop the tag.
  attest:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token gets the short-lived Sigstore signing certificate.
      id-token: write
      # Stores the attestation in the repository.
      attestations: write
    steps:
      - name: Download the published files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-central-files
          path: maven-central

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            maven-central/**/*.jar
            maven-central/**/*.pom
            maven-central/**/*.module

  release:
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.new_tag != ''
    runs-on: ubuntu-latest
    # The secret of the release app is an environment secret. Only this job can read it.
    environment: readme-update
    permissions:
      # The GitHub release uses the GITHUB_TOKEN. The README push uses the token of the app.
      contents: write
    steps:
      - name: Download the published files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-central-files
          path: release

      - name: Create the tag and the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: BookMap ${{ needs.build.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          body: ${{ needs.build.outputs.changelog }}
          files: release/**/*.jar
          fail_on_unmatched_files: true

      - name: Check the release app settings
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The release $NEW_VERSION is complete, but the README update" \
              "cannot run: set the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY" \
              "in the readme-update environment. See RELEASING.md."
            exit 1
          fi

      - name: Create a token of the release app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: repository
          token: ${{ steps.app-token.outputs.token }}

      - name: Set the version in the README files
        working-directory: repository
        env:
          NEW_VERSION: ${{ needs.build.outputs.new_version }}
        run: |
          scripts/set-readme-version.sh "$NEW_VERSION"
          if git diff --quiet; then
            echo "README.md already has version $NEW_VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "docs: set the README version to $NEW_VERSION"
          if ! git push origin HEAD:main; then
            echo "::error::Cannot push the README update to main. The release $NEW_VERSION is complete." \
              "Add the release app as a bypass actor of the main ruleset, or run" \
              "scripts/set-readme-version.sh $NEW_VERSION in a pull request. See RELEASING.md."
            exit 1
          fi
